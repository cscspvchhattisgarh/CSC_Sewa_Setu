<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
    .form-container { max-width: 750px; margin: auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    /* Header & Logo Design */
    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #003366;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .logo-img {
      max-height: 65px;
      width: auto;
      object-fit: contain;
    }
    .header-title-container {
      text-align: center;
      flex-grow: 1;
      padding: 0 10px;
    }
    .header-title {
      color: #003366;
      font-weight: 700;
      font-size: 1.25rem;
      margin: 0;
      text-transform: uppercase;
    }
    .sub-title {
      font-size: 0.85rem;
      color: #555;
      font-weight: 600;
      margin-top: 3px;
    }

    .section-title { background-color: #003366; color: white; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; margin-top: 20px; }
    #loadingSpinner { display: block; text-align: center; color: #003366; margin-bottom: 10px; font-weight: bold; }
    .gps-status { font-size: 0.85rem; font-weight: bold; margin-top: 4px; }
    
    .download-box { 
      background-color: #eef5ff; 
      border: 1px dashed #003366; 
      border-radius: 8px; 
      padding: 12px; 
      text-align: center; 
      margin-bottom: 20px; 
    }
  </style>
</head>
<body>

<div class="form-container">
  
  <!-- Top Branding Header with Left & Right Logos -->
  <div class="header-box">
    <!-- Left Logo: CSC -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/13/CSC_Logo.png" alt="CSC Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/120x60?text=CSC+Logo'">
    
    <!-- Center Title -->
    <div class="header-title-container">
      <h5 class="header-title">CSC & Sewa Setu</h5>
      <div class="sub-title">Common Branding Upload Portal</div>
    </div>
    
    <!-- Right Logo: Sewa Setu -->
    <img src="https://sevasetu.cg.gov.in/assets/img/logo.png" alt="Sewa Setu Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/120x60?text=Sewa+Setu'">
  </div>
  
  <!-- Download Format Link Box -->
  <div class="download-box">
    <div style="font-size: 0.9rem; color: #003366; font-weight: bold;">
      ब्रांडिंग का फॉर्मेट आप नीचे दिए गए लिंक से डाउनलोड कर सकते हैं।
    </div>
    <a href="https://drive.google.com/drive/folders/1H7BcClaf5uauj9nDPppomVMqJovdLn8X?usp=sharing" target="_blank" class="btn btn-sm btn-success mt-2 font-weight-bold">
      📁 Download Branding Format Link
    </a>
  </div>

  <div id="loadingSpinner">Data loading from Sheet... Please wait.</div>

  <form id="brandingForm" style="display:none;">
    <!-- Section 1: Location Selection -->
    <div class="section-title">1. Location Details</div>
    
    <div class="mb-3 mt-2">
      <label class="form-label font-weight-bold">Location Type *</label>
      <select id="locationType" name="locationType" class="form-select" required onchange="onLocationTypeChange()">
        <option value="">-- Select Location Type --</option>
        <option value="RURAL">RURAL</option>
        <option value="URBAN">URBAN</option>
      </select>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">District Name *</label>
        <select id="districtSelect" name="districtName" class="form-select" required onchange="onDistrictChange()">
          <option value="">-- Select District --</option>
        </select>
        <input type="hidden" id="districtCode" name="districtCode">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Block Name *</label>
        <select id="blockSelect" name="blockName" class="form-select" required onchange="onBlockChange()">
          <option value="">-- Select Block --</option>
        </select>
        <input type="hidden" id="blockCode" name="blockCode">
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" id="lblGpCity">Grampanchayat / City *</label>
        <select id="gpCitySelect" name="gpCityName" class="form-select" required onchange="onGpCityChange()">
          <option value="">-- Select --</option>
        </select>
        <input type="hidden" id="gpCityCode" name="gpCityCode">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" id="lblVillageWard">Village / Ward *</label>
        <select id="villageWardSelect" name="villageWardName" class="form-select" required onchange="onVillageWardChange()">
          <option value="">-- Select --</option>
        </select>
        <input type="hidden" id="villageWardCode" name="villageWardCode">
      </div>
    </div>

    <!-- Section 2: VLE & Center Details -->
    <div class="section-title">2. VLE & Center Details</div>
    
    <div class="row mt-2">
      <div class="col-md-6 mb-3">
        <label class="form-label">CSC ID *</label>
        <input type="text" name="cscId" class="form-control" placeholder="12 Digit CSC ID" required pattern="[0-9]{12}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Sewa Setu Kendra ID *</label>
        <input type="text" name="sewaSetuId" class="form-control" required placeholder="Enter Kendra ID">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">VLE Name * (Alphabets Only)</label>
      <input type="text" name="vleName" id="vleName" class="form-control" 
             placeholder="Enter VLE Name" required pattern="[A-Za-z\s]+" 
             title="Only alphabets and spaces are allowed"
             oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Mobile Number *</label>
        <input type="tel" name="mobileNumber" class="form-control" pattern="[0-9]{10}" placeholder="10 Digit Number" maxlength="10" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email ID *</label>
        <input type="email" name="emailId" class="form-control" placeholder="example@mail.com" required>
      </div>
    </div>

    <!-- Section 3: Geolocation & Photo Upload -->
    <div class="section-title">3. Location Geo-tag & Branding Photo</div>
    
    <div class="row mt-2">
      <div class="col-md-6 mb-3">
        <label class="form-label">Latitude *</label>
        <input type="text" id="latitude" name="latitude" class="form-control" readonly required placeholder="Auto-fetching...">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Longitude *</label>
        <input type="text" id="longitude" name="longitude" class="form-control" readonly required placeholder="Auto-fetching...">
      </div>
    </div>
    <button type="button" class="btn btn-sm btn-secondary mb-1" onclick="getLocation()">Fetch Current GPS Location</button>
    <div id="gpsMsg" class="gps-status"></div>

    <div class="mb-3 mt-3">
      <label class="form-label">CSC & Sewa Setu Branding Photo *</label>
      <input type="file" name="photoFile" accept="image/*" class="form-control" required>
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-3 p-2 font-weight-bold">Submit Branding Data</button>
  </form>
  <div id="statusMsg" class="mt-3 text-center font-weight-bold"></div>
</div>

<script>
  let masterData = {};
  let currentDataset = [];

  window.onload = function() {
    google.script.run.withSuccessHandler(function(res) {
      if(res.success) {
        masterData = res;
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('brandingForm').style.display = 'block';
      } else {
        document.getElementById('loadingSpinner').innerText = 'Error loading sheet data: ' + res.error;
      }
    }).getMasterData();
    
    getLocation();
  };

  function getLocation() {
    const gpsMsg = document.getElementById('gpsMsg');
    gpsMsg.style.color = "blue";
    gpsMsg.innerText = "Fetching Location... Please allow GPS permission in browser.";

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(position) {
          document.getElementById('latitude').value = position.coords.latitude;
          document.getElementById('longitude').value = position.coords.longitude;
          gpsMsg.style.color = "green";
          gpsMsg.innerText = "GPS Location captured successfully!";
        },
        function(error) {
          gpsMsg.style.color = "red";
          switch(error.code) {
            case error.PERMISSION_DENIED:
              gpsMsg.innerText = "Permission denied. Please allow location access in browser setting.";
              break;
            case error.POSITION_UNAVAILABLE:
              gpsMsg.innerText = "Location information unavailable. Turn on device GPS.";
              break;
            case error.TIMEOUT:
              gpsMsg.innerText = "Location request timed out. Please try clicking button again.";
              break;
            default:
              gpsMsg.innerText = "An unknown error occurred while fetching GPS.";
          }
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    } else {
      gpsMsg.style.color = "red";
      gpsMsg.innerText = "Geolocation is not supported by this browser.";
    }
  }

  function onLocationTypeChange() {
    const type = document.getElementById('locationType').value;
    const distSelect = document.getElementById('districtSelect');
    distSelect.innerHTML = '<option value="">-- Select District --</option>';
    resetDropdowns(['blockSelect', 'gpCitySelect', 'villageWardSelect']);

    if (!type) return;
    
    currentDataset = (type === 'RURAL') ? masterData.rural : masterData.urban;
    
    document.getElementById('lblGpCity').innerText = (type === 'RURAL') ? 'Grampanchayat Name *' : 'City Name *';
    document.getElementById('lblVillageWard').innerText = (type === 'RURAL') ? 'Village Name *' : 'Ward Name & Number *';

    const districts = [...new Set(currentDataset.slice(1).map(row => String(row[1]).trim()))].filter(Boolean);
    districts.forEach(d => {
      distSelect.innerHTML += `<option value="${d}">${d}</option>`;
    });
  }

  function onDistrictChange() {
    const dist = document.getElementById('districtSelect').value;
    const blockSelect = document.getElementById('blockSelect');
    resetDropdowns(['blockSelect', 'gpCitySelect', 'villageWardSelect']);

    const matchedRow = currentDataset.find(row => String(row[1]).trim() === dist);
    if (matchedRow) document.getElementById('districtCode').value = matchedRow[2];

    const blocks = [...new Set(currentDataset.slice(1).filter(row => String(row[1]).trim() === dist).map(row => String(row[3]).trim()))].filter(Boolean);
    blocks.forEach(b => {
      blockSelect.innerHTML += `<option value="${b}">${b}</option>`;
    });
  }

  function onBlockChange() {
    const dist = document.getElementById('districtSelect').value;
    const block = document.getElementById('blockSelect').value;
    const gpCitySelect = document.getElementById('gpCitySelect');
    resetDropdowns(['gpCitySelect', 'villageWardSelect']);

    const matchedRow = currentDataset.find(row => String(row[1]).trim() === dist && String(row[3]).trim() === block);
    if (matchedRow) document.getElementById('blockCode').value = matchedRow[4];

    const gpCities = [...new Set(currentDataset.slice(1).filter(row => String(row[1]).trim() === dist && String(row[3]).trim() === block).map(row => String(row[5]).trim()))].filter(Boolean);
    gpCities.forEach(g => {
      gpCitySelect.innerHTML += `<option value="${g}">${g}</option>`;
    });
  }

  function onGpCityChange() {
    const dist = document.getElementById('districtSelect').value;
    const block = document.getElementById('blockSelect').value;
    const gpCity = document.getElementById('gpCitySelect').value;
    const villageWardSelect = document.getElementById('villageWardSelect');
    resetDropdowns(['villageWardSelect']);

    const matchedRow = currentDataset.find(row => String(row[1]).trim() === dist && String(row[3]).trim() === block && String(row[5]).trim() === gpCity);
    if (matchedRow) document.getElementById('gpCityCode').value = matchedRow[6];

    const villageWards = [...new Set(currentDataset.slice(1).filter(row => String(row[1]).trim() === dist && String(row[3]).trim() === block && String(row[5]).trim() === gpCity).map(row => String(row[7]).trim()))].filter(Boolean);
    villageWards.forEach(v => {
      villageWardSelect.innerHTML += `<option value="${v}">${v}</option>`;
    });
  }

  function onVillageWardChange() {
    const dist = document.getElementById('districtSelect').value;
    const block = document.getElementById('blockSelect').value;
    const gpCity = document.getElementById('gpCitySelect').value;
    const villageWard = document.getElementById('villageWardSelect').value;

    const matchedRow = currentDataset.find(row => String(row[1]).trim() === dist && String(row[3]).trim() === block && String(row[5]).trim() === gpCity && String(row[7]).trim() === villageWard);
    if (matchedRow) document.getElementById('villageWardCode').value = matchedRow[8];
  }

  function resetDropdowns(ids) {
    ids.forEach(id => {
      document.getElementById(id).innerHTML = '<option value="">-- Select --</option>';
    });
  }

  document.getElementById('brandingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('statusMsg');
    
    btn.disabled = true;
    msg.style.color = "blue";
    msg.innerText = "Uploading data & photo... Please wait.";

    google.script.run.withSuccessHandler(function(res) {
      if(res.success) {
        msg.style.color = "green";
        msg.innerText = res.message;
        document.getElementById('brandingForm').reset();
      } else {
        msg.style.color = "red";
        msg.innerText = "Error: " + res.message;
      }
      btn.disabled = false;
    }).processForm(this);
  });
</script>
</body>
</html>
